<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 440" fill="none">
  <defs>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ffffff;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#f2f4f6;stop-opacity:1"/>
    </linearGradient>
    <linearGradient id="blueGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#4da3ff"/>
      <stop offset="100%" style="stop-color:#3182f6"/>
    </linearGradient>
    <linearGradient id="darkGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#2d3540"/>
      <stop offset="100%" style="stop-color:#191f28"/>
    </linearGradient>
    <linearGradient id="sphereGrad1" x1="30%" y1="20%" x2="80%" y2="90%">
      <stop offset="0%" style="stop-color:#6db6ff"/>
      <stop offset="100%" style="stop-color:#3182f6"/>
    </linearGradient>
    <linearGradient id="sphereGrad2" x1="20%" y1="10%" x2="90%" y2="90%">
      <stop offset="0%" style="stop-color:#a5d4ff"/>
      <stop offset="50%" style="stop-color:#3182f6"/>
      <stop offset="100%" style="stop-color:#1b64da"/>
    </linearGradient>
    <linearGradient id="purpleGrad" x1="30%" y1="10%" x2="80%" y2="90%">
      <stop offset="0%" style="stop-color:#c9a5ff"/>
      <stop offset="100%" style="stop-color:#8b5cf6"/>
    </linearGradient>
    <filter id="shadow1" x="-10%" y="-5%" width="130%" height="130%">
      <feDropShadow dx="0" dy="8" stdDeviation="16" flood-color="#191f28" flood-opacity="0.08"/>
    </filter>
    <filter id="shadow2" x="-10%" y="-5%" width="130%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="24" flood-color="#191f28" flood-opacity="0.12"/>
    </filter>
    <filter id="shadow3" x="-10%" y="-5%" width="130%" height="130%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#3182f6" flood-opacity="0.3"/>
    </filter>
    <radialGradient id="sphereShine" cx="35%" cy="30%" r="60%">
      <stop offset="0%" style="stop-color:#ffffff;stop-opacity:0.6"/>
      <stop offset="100%" style="stop-color:#ffffff;stop-opacity:0"/>
    </radialGradient>
  </defs>

  <!-- Main calendar card - 3D perspective -->
  <g filter="url(#shadow2)" transform="translate(80, 40)">
    <!-- Card body -->
    <rect x="0" y="0" width="340" height="320" rx="24" fill="url(#cardGrad)" stroke="#e5e8eb" stroke-width="1"/>

    <!-- Card header -->
    <rect x="0" y="0" width="340" height="72" rx="24" fill="url(#darkGrad)"/>
    <rect x="0" y="48" width="340" height="24" fill="url(#darkGrad)"/>

    <!-- Header text -->
    <text x="28" y="32" font-family="Arial, sans-serif" font-size="13" fill="#8b95a1" font-weight="600">2026년 3월</text>
    <text x="28" y="52" font-family="Arial, sans-serif" font-size="18" fill="#ffffff" font-weight="700">연습실 예약 현황</text>

    <!-- Nav dots -->
    <circle cx="296" cy="36" r="4" fill="#3182f6"/>
    <circle cx="310" cy="36" r="4" fill="#4e5968"/>
    <circle cx="324" cy="36" r="4" fill="#4e5968"/>

    <!-- Calendar grid -->
    <!-- Day headers -->
    <text x="36" y="100" font-family="Arial, sans-serif" font-size="11" fill="#8b95a1" text-anchor="middle" font-weight="500">일</text>
    <text x="80" y="100" font-family="Arial, sans-serif" font-size="11" fill="#8b95a1" text-anchor="middle" font-weight="500">월</text>
    <text x="124" y="100" font-family="Arial, sans-serif" font-size="11" fill="#8b95a1" text-anchor="middle" font-weight="500">화</text>
    <text x="168" y="100" font-family="Arial, sans-serif" font-size="11" fill="#8b95a1" text-anchor="middle" font-weight="500">수</text>
    <text x="212" y="100" font-family="Arial, sans-serif" font-size="11" fill="#8b95a1" text-anchor="middle" font-weight="500">목</text>
    <text x="256" y="100" font-family="Arial, sans-serif" font-size="11" fill="#8b95a1" text-anchor="middle" font-weight="500">금</text>
    <text x="300" y="100" font-family="Arial, sans-serif" font-size="11" fill="#8b95a1" text-anchor="middle" font-weight="500">토</text>

    <!-- Week 1 -->
    <text x="36" y="132" font-family="Arial, sans-serif" font-size="13" fill="#b0b8c1" text-anchor="middle">23</text>
    <text x="80" y="132" font-family="Arial, sans-serif" font-size="13" fill="#b0b8c1" text-anchor="middle">24</text>
    <text x="124" y="132" font-family="Arial, sans-serif" font-size="13" fill="#b0b8c1" text-anchor="middle">25</text>
    <text x="168" y="132" font-family="Arial, sans-serif" font-size="13" fill="#b0b8c1" text-anchor="middle">26</text>
    <text x="212" y="132" font-family="Arial, sans-serif" font-size="13" fill="#b0b8c1" text-anchor="middle">27</text>
    <text x="256" y="132" font-family="Arial, sans-serif" font-size="13" fill="#b0b8c1" text-anchor="middle">28</text>
    <text x="300" y="132" font-family="Arial, sans-serif" font-size="13" fill="#191f28" text-anchor="middle">1</text>

    <!-- Week 2 -->
    <text x="36" y="168" font-family="Arial, sans-serif" font-size="13" fill="#191f28" text-anchor="middle">2</text>
    <text x="80" y="168" font-family="Arial, sans-serif" font-size="13" fill="#191f28" text-anchor="middle">3</text>
    <text x="124" y="168" font-family="Arial, sans-serif" font-size="13" fill="#191f28" text-anchor="middle">4</text>
    <text x="168" y="168" font-family="Arial, sans-serif" font-size="13" fill="#191f28" text-anchor="middle">5</text>
    <text x="212" y="168" font-family="Arial, sans-serif" font-size="13" fill="#191f28" text-anchor="middle">6</text>
    <!-- Selected day highlight -->
    <circle cx="256" cy="164" r="16" fill="#3182f6"/>
    <text x="256" y="168" font-family="Arial, sans-serif" font-size="13" fill="#ffffff" text-anchor="middle" font-weight="700">7</text>
    <text x="300" y="168" font-family="Arial, sans-serif" font-size="13" fill="#191f28" text-anchor="middle">8</text>
    <!-- Reservation dots -->
    <circle cx="80" cy="178" r="2.5" fill="#3182f6"/>
    <circle cx="168" cy="178" r="2.5" fill="#3182f6"/>
    <circle cx="212" cy="178" r="2.5" fill="#3182f6"/>

    <!-- Week 3 -->
    <text x="36" y="204" font-family="Arial, sans-serif" font-size="13" fill="#191f28" text-anchor="middle">9</text>
    <text x="80" y="204" font-family="Arial, sans-serif" font-size="13" fill="#191f28" text-anchor="middle">10</text>
    <text x="124" y="204" font-family="Arial, sans-serif" font-size="13" fill="#191f28" text-anchor="middle">11</text>
    <text x="168" y="204" font-family="Arial, sans-serif" font-size="13" fill="#191f28" text-anchor="middle">12</text>
    <text x="212" y="204" font-family="Arial, sans-serif" font-size="13" fill="#191f28" text-anchor="middle">13</text>
    <text x="256" y="204" font-family="Arial, sans-serif" font-size="13" fill="#191f28" text-anchor="middle">14</text>
    <text x="300" y="204" font-family="Arial, sans-serif" font-size="13" fill="#191f28" text-anchor="middle">15</text>
    <circle cx="124" cy="214" r="2.5" fill="#f97316"/>
    <circle cx="300" cy="214" r="2.5" fill="#3182f6"/>

    <!-- Reservation card at bottom -->
    <rect x="20" y="236" width="300" height="64" rx="14" fill="#f2f4f6"/>
    <circle cx="44" cy="268" r="12" fill="#3182f6" opacity="0.15"/>
    <text x="44" y="272" font-family="Arial, sans-serif" font-size="12" text-anchor="middle">🎵</text>
    <text x="66" y="258" font-family="Arial, sans-serif" font-size="12" fill="#191f28" font-weight="600">합동연습실</text>
    <text x="66" y="278" font-family="Arial, sans-serif" font-size="11" fill="#8b95a1">18:00 ~ 21:00</text>
    <rect x="236" y="254" width="64" height="26" rx="13" fill="#3182f6" opacity="0.1"/>
    <text x="268" y="271" font-family="Arial, sans-serif" font-size="10" fill="#3182f6" text-anchor="middle" font-weight="600">예약됨</text>
  </g>

  <!-- Floating notification card -->
  <g filter="url(#shadow1)" transform="translate(340, 180)">
    <rect x="0" y="0" width="200" height="72" rx="16" fill="white" stroke="#e5e8eb" stroke-width="1"/>
    <circle cx="28" cy="36" r="14" fill="#3182f6" opacity="0.1"/>
    <text x="28" y="40" font-family="Arial, sans-serif" font-size="14" text-anchor="middle">✏️</text>
    <text x="52" y="30" font-family="Arial, sans-serif" font-size="11" fill="#191f28" font-weight="600">새 예약이 등록됐어요</text>
    <text x="52" y="46" font-family="Arial, sans-serif" font-size="10" fill="#8b95a1">댄스3실 · 19:00~21:00</text>
  </g>

  <!-- 3D Sphere 1 (large) -->
  <circle cx="480" cy="80" r="40" fill="url(#sphereGrad2)"/>
  <circle cx="480" cy="80" r="40" fill="url(#sphereShine)"/>

  <!-- 3D Sphere 2 (small) -->
  <circle cx="60" cy="280" r="22" fill="url(#purpleGrad)"/>
  <circle cx="60" cy="280" r="22" fill="url(#sphereShine)"/>

  <!-- 3D Sphere 3 (tiny) -->
  <circle cx="520" cy="340" r="14" fill="url(#sphereGrad1)"/>
  <circle cx="520" cy="340" r="14" fill="url(#sphereShine)"/>

  <!-- Small floating dot -->
  <circle cx="100" cy="60" r="6" fill="#3182f6" opacity="0.2"/>
  <circle cx="460" cy="400" r="8" fill="#8b5cf6" opacity="0.15"/>
</svg>
