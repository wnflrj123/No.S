<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 440" fill="none">
  <defs>
    <linearGradient id="ncardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ffffff;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#f2f4f6;stop-opacity:1"/>
    </linearGradient>
    <linearGradient id="nblueGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#4da3ff"/>
      <stop offset="100%" style="stop-color:#3182f6"/>
    </linearGradient>
    <linearGradient id="ndarkGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#2d3540"/>
      <stop offset="100%" style="stop-color:#191f28"/>
    </linearGradient>
    <linearGradient id="nsphereGrad1" x1="30%" y1="20%" x2="80%" y2="90%">
      <stop offset="0%" style="stop-color:#6db6ff"/>
      <stop offset="100%" style="stop-color:#3182f6"/>
    </linearGradient>
    <linearGradient id="nsphereGrad2" x1="20%" y1="10%" x2="90%" y2="90%">
      <stop offset="0%" style="stop-color:#a5d4ff"/>
      <stop offset="50%" style="stop-color:#3182f6"/>
      <stop offset="100%" style="stop-color:#1b64da"/>
    </linearGradient>
    <linearGradient id="npurpleGrad" x1="30%" y1="10%" x2="80%" y2="90%">
      <stop offset="0%" style="stop-color:#c9a5ff"/>
      <stop offset="100%" style="stop-color:#8b5cf6"/>
    </linearGradient>
    <linearGradient id="namberGrad" x1="30%" y1="10%" x2="80%" y2="90%">
      <stop offset="0%" style="stop-color:#fcd34d"/>
      <stop offset="100%" style="stop-color:#f59e0b"/>
    </linearGradient>
    <filter id="nshadow1" x="-10%" y="-5%" width="130%" height="130%">
      <feDropShadow dx="0" dy="8" stdDeviation="16" flood-color="#191f28" flood-opacity="0.08"/>
    </filter>
    <filter id="nshadow2" x="-10%" y="-5%" width="130%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="24" flood-color="#191f28" flood-opacity="0.12"/>
    </filter>
    <filter id="nshadow3" x="-10%" y="-5%" width="130%" height="130%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#3182f6" flood-opacity="0.3"/>
    </filter>
    <radialGradient id="nsphereShine" cx="35%" cy="30%" r="60%">
      <stop offset="0%" style="stop-color:#ffffff;stop-opacity:0.6"/>
      <stop offset="100%" style="stop-color:#ffffff;stop-opacity:0"/>
    </radialGradient>
  </defs>

  <!-- Main notice board card -->
  <g filter="url(#nshadow2)" transform="translate(70, 30)">
    <!-- Card body -->
    <rect x="0" y="0" width="350" height="340" rx="24" fill="url(#ncardGrad)" stroke="#e5e8eb" stroke-width="1"/>

    <!-- Card header -->
    <rect x="0" y="0" width="350" height="72" rx="24" fill="url(#ndarkGrad)"/>
    <rect x="0" y="48" width="350" height="24" fill="url(#ndarkGrad)"/>

    <!-- Header icon and text -->
    <text x="28" y="32" font-family="Arial, sans-serif" font-size="13" fill="#8b95a1" font-weight="600">No.S</text>
    <text x="28" y="52" font-family="Arial, sans-serif" font-size="18" fill="#ffffff" font-weight="700">공지사항</text>

    <!-- Bell icon -->
    <circle cx="318" cy="36" r="16" fill="#3182f6" opacity="0.2"/>
    <text x="318" y="41" font-family="Arial, sans-serif" font-size="16" text-anchor="middle">🔔</text>

    <!-- Pinned notice item -->
    <g transform="translate(20, 88)">
      <rect x="0" y="0" width="310" height="64" rx="14" fill="#3182f6" opacity="0.08"/>
      <rect x="0" y="0" width="4" height="64" rx="2" fill="#3182f6"/>
      <text x="20" y="22" font-family="Arial, sans-serif" font-size="11" fill="#3182f6" font-weight="700">📌 고정</text>
      <text x="20" y="42" font-family="Arial, sans-serif" font-size="13" fill="#191f28" font-weight="600">3월 정기공연 안내</text>
      <text x="20" y="56" font-family="Arial, sans-serif" font-size="10" fill="#8b95a1">2026.03.01</text>
      <text x="284" y="37" font-family="Arial, sans-serif" font-size="14" fill="#8b95a1">›</text>
    </g>

    <!-- Notice item 2 -->
    <g transform="translate(20, 164)">
      <rect x="0" y="0" width="310" height="52" rx="14" fill="#f2f4f6"/>
      <circle cx="24" cy="26" r="12" fill="#8b5cf6" opacity="0.1"/>
      <text x="24" y="30" font-family="Arial, sans-serif" font-size="11" text-anchor="middle">📢</text>
      <text x="46" y="22" font-family="Arial, sans-serif" font-size="12" fill="#191f28" font-weight="600">연습실 이용 규칙 변경</text>
      <text x="46" y="38" font-family="Arial, sans-serif" font-size="10" fill="#8b95a1">2026.02.28</text>
      <text x="284" y="30" font-family="Arial, sans-serif" font-size="14" fill="#8b95a1">›</text>
    </g>

    <!-- Notice item 3 -->
    <g transform="translate(20, 228)">
      <rect x="0" y="0" width="310" height="52" rx="14" fill="#f2f4f6"/>
      <circle cx="24" cy="26" r="12" fill="#f59e0b" opacity="0.1"/>
      <text x="24" y="30" font-family="Arial, sans-serif" font-size="11" text-anchor="middle">🎵</text>
      <text x="46" y="22" font-family="Arial, sans-serif" font-size="12" fill="#191f28" font-weight="600">신규 회원 환영합니다!</text>
      <text x="46" y="38" font-family="Arial, sans-serif" font-size="10" fill="#8b95a1">2026.02.25</text>
      <text x="284" y="30" font-family="Arial, sans-serif" font-size="14" fill="#8b95a1">›</text>
    </g>

    <!-- Pagination dots -->
    <circle cx="155" cy="310" r="4" fill="#3182f6"/>
    <circle cx="170" cy="310" r="4" fill="#4e5968" opacity="0.3"/>
    <circle cx="185" cy="310" r="4" fill="#4e5968" opacity="0.3"/>
  </g>

  <!-- Floating new notice badge -->
  <g filter="url(#nshadow1)" transform="translate(340, 60)">
    <rect x="0" y="0" width="180" height="64" rx="16" fill="white" stroke="#e5e8eb" stroke-width="1"/>
    <circle cx="26" cy="32" r="14" fill="#3182f6" opacity="0.12"/>
    <text x="26" y="37" font-family="Arial, sans-serif" font-size="14" text-anchor="middle">🔔</text>
    <text x="50" y="26" font-family="Arial, sans-serif" font-size="11" fill="#191f28" font-weight="600">새 공지가 올라왔어요</text>
    <text x="50" y="42" font-family="Arial, sans-serif" font-size="10" fill="#3182f6" font-weight="500">지금 확인하기</text>
  </g>

  <!-- Floating pin card -->
  <g filter="url(#nshadow1)" transform="translate(360, 260)">
    <rect x="0" y="0" width="160" height="56" rx="14" fill="white" stroke="#e5e8eb" stroke-width="1"/>
    <text x="20" y="23" font-family="Arial, sans-serif" font-size="11" fill="#3182f6" font-weight="700">📌 상단 고정됨</text>
    <text x="20" y="42" font-family="Arial, sans-serif" font-size="10" fill="#8b95a1">모든 회원에게 보여요</text>
  </g>

  <!-- 3D Sphere 1 (large) -->
  <circle cx="500" cy="90" r="36" fill="url(#nsphereGrad2)"/>
  <circle cx="500" cy="90" r="36" fill="url(#nsphereShine)"/>

  <!-- 3D Sphere 2 (small purple) -->
  <circle cx="50" cy="300" r="20" fill="url(#npurpleGrad)"/>
  <circle cx="50" cy="300" r="20" fill="url(#nsphereShine)"/>

  <!-- 3D Sphere 3 (tiny amber) -->
  <circle cx="530" cy="370" r="14" fill="url(#namberGrad)"/>
  <circle cx="530" cy="370" r="14" fill="url(#nsphereShine)"/>

  <!-- 3D Sphere 4 (tiny) -->
  <circle cx="480" cy="200" r="10" fill="url(#nsphereGrad1)"/>
  <circle cx="480" cy="200" r="10" fill="url(#nsphereShine)"/>

  <!-- Small floating dots -->
  <circle cx="90" cy="50" r="6" fill="#3182f6" opacity="0.2"/>
  <circle cx="540" cy="420" r="8" fill="#8b5cf6" opacity="0.15"/>
  <circle cx="30" cy="180" r="5" fill="#f59e0b" opacity="0.12"/>
</svg>