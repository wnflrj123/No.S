<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 200" fill="none">
  <defs>
    <linearGradient id="ecCardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ffffff"/>
      <stop offset="100%" style="stop-color:#f2f4f6"/>
    </linearGradient>
    <linearGradient id="ecBlueGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#4da3ff"/>
      <stop offset="100%" style="stop-color:#3182f6"/>
    </linearGradient>
    <linearGradient id="ecSphereGrad" x1="30%" y1="20%" x2="80%" y2="90%">
      <stop offset="0%" style="stop-color:#a5d4ff"/>
      <stop offset="50%" style="stop-color:#3182f6"/>
      <stop offset="100%" style="stop-color:#1b64da"/>
    </linearGradient>
    <radialGradient id="ecShine" cx="35%" cy="30%" r="60%">
      <stop offset="0%" style="stop-color:#ffffff;stop-opacity:0.5"/>
      <stop offset="100%" style="stop-color:#ffffff;stop-opacity:0"/>
    </radialGradient>
    <filter id="ecShadow" x="-10%" y="-5%" width="130%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="12" flood-color="#191f28" flood-opacity="0.08"/>
    </filter>
  </defs>

  <!-- Main card -->
  <g filter="url(#ecShadow)" transform="translate(40, 20)">
    <rect width="160" height="140" rx="18" fill="url(#ecCardGrad)" stroke="#e5e8eb" stroke-width="0.5"/>

    <!-- Header bar -->
    <rect width="160" height="36" rx="18" fill="url(#ecBlueGrad)"/>
    <rect y="18" width="160" height="18" fill="url(#ecBlueGrad)"/>
    <text x="16" y="25" font-family="Arial, sans-serif" font-size="11" fill="white" font-weight="600">예약 현황</text>

    <!-- Empty grid lines -->
    <line x1="20" y1="52" x2="140" y2="52" stroke="#e5e8eb" stroke-width="1"/>
    <line x1="20" y1="72" x2="140" y2="72" stroke="#e5e8eb" stroke-width="1"/>
    <line x1="20" y1="92" x2="140" y2="92" stroke="#e5e8eb" stroke-width="1"/>
    <line x1="20" y1="112" x2="140" y2="112" stroke="#e5e8eb" stroke-width="1"/>

    <!-- Dashed placeholder lines -->
    <line x1="28" y1="62" x2="80" y2="62" stroke="#d1d6db" stroke-width="2" stroke-linecap="round" stroke-dasharray="4 4"/>
    <line x1="28" y1="82" x2="100" y2="82" stroke="#d1d6db" stroke-width="2" stroke-linecap="round" stroke-dasharray="4 4"/>
    <line x1="28" y1="102" x2="65" y2="102" stroke="#d1d6db" stroke-width="2" stroke-linecap="round" stroke-dasharray="4 4"/>
    <line x1="28" y1="122" x2="90" y2="122" stroke="#d1d6db" stroke-width="2" stroke-linecap="round" stroke-dasharray="4 4"/>

    <!-- Empty circle icon -->
    <circle cx="130" cy="87" r="18" fill="#f2f4f6" stroke="#e5e8eb" stroke-width="1"/>
    <text x="130" y="92" font-family="Arial, sans-serif" font-size="16" fill="#b0b8c1" text-anchor="middle">?</text>
  </g>

  <!-- Decorative sphere -->
  <circle cx="30" cy="50" r="14" fill="url(#ecSphereGrad)"/>
  <circle cx="30" cy="50" r="14" fill="url(#ecShine)"/>

  <!-- Small sphere -->
  <circle cx="210" cy="140" r="8" fill="url(#ecBlueGrad)" opacity="0.4"/>
  <circle cx="210" cy="140" r="8" fill="url(#ecShine)"/>

  <!-- Tiny dots -->
  <circle cx="205" cy="35" r="4" fill="#3182f6" opacity="0.15"/>
  <circle cx="45" cy="170" r="5" fill="#8b5cf6" opacity="0.12"/>
  <circle cx="180" cy="175" r="3" fill="#3182f6" opacity="0.2"/>
</svg>
